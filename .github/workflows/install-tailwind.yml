name: Install Tailwind dependencies

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/install-tailwind.yml

permissions:
  contents: write

concurrency:
  group: install-tailwind-main
  cancel-in-progress: false

jobs:
  install:
    name: Install Tailwind v4 and update lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Tailwind v4 and Vite plugin
        run: npm install --save-dev tailwindcss @tailwindcss/vite

      - name: Commit generated package manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Tailwind dependencies already installed."
            exit 0
          fi
          git commit -m "build: install Tailwind CSS v4"
          git push origin main
