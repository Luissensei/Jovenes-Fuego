name: Build verification

on:
  push:
    branches:
      - "redesign/**"
      - "connect/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Lint source code
        run: npm run lint
      - name: Auditoría de dependencias de producción
        run: |
          npm audit --omit=dev --json > /tmp/jf-npm-audit-production.json || true
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/jf-npm-audit-production.json', 'utf8')); const v = r.metadata?.vulnerabilities ?? {}; console.log('Auditoría de producción:', JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ' | ' + item.severity + ' | fixAvailable: ' + JSON.stringify(item.fixAvailable));"
      - name: Preparar Node 22 para Cloud Functions
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Instalar dependencias de Cloud Functions
        run: npm ci --prefix functions
      - name: Compilar Cloud Functions
        run: npm run build --prefix functions
      - name: Revisar ESLint de Cloud Functions
        run: npm run lint --prefix functions
      - name: Instalar dependencias del codebase aislado de solo lectura
        run: npm install --prefix functions-readonly
      - name: Compilar funciones aisladas de solo lectura
        run: npm run build --prefix functions-readonly
      - name: Auditar dependencias runtime de Cloud Functions
        run: npm audit --prefix functions --omit=dev --audit-level=high
      - name: Resumen de auditoría de dependencias
        run: |
          npm audit --json > /tmp/jf-npm-audit.json || true
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/jf-npm-audit.json', 'utf8')); const v = r.metadata?.vulnerabilities ?? {}; console.log('Auditoría npm:', JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ' | ' + item.severity + ' | fixAvailable: ' + JSON.stringify(item.fixAvailable));"
