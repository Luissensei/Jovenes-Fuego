name: Deploy Firebase Original Functions

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-original-functions:
    name: Deploy Cloud Functions to original Firebase project
    runs-on: ubuntu-24.04
    environment: firebase-production
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Lint Firebase Functions
        run: npx eslint -c .eslintrc.js "src/**/*.ts"
        working-directory: functions
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
      - name: Build Firebase Functions
        run: npm run build
        working-directory: functions
      - name: Verify Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error title=Missing GitHub environment secret::Add FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO to Settings > Environments > firebase-production > Environment secrets."
            exit 1
          fi
          node <<'NODE'
          const raw = process.env.FIREBASE_SERVICE_ACCOUNT_KEY;
          let credential;
          try {
            credential = JSON.parse(raw);
          } catch {
            console.error(
              "::error title=Invalid Firebase secret::The secret must contain the raw contents of the downloaded JSON file, not a file path, Base64 text, or compressed/binary data."
            );
            process.exit(1);
          }
          if (
            credential.type !== "service_account" ||
            credential.project_id !== "jovenes-de-fuego" ||
            typeof credential.client_email !== "string" ||
            typeof credential.private_key !== "string" ||
            !credential.private_key.includes("-----BEGIN PRIVATE KEY-----")
          ) {
            console.error(
              "::error title=Wrong Firebase credential::Use a service-account JSON key from the jovenes-de-fuego project."
            );
            process.exit(1);
          }
          console.log("Firebase service-account JSON format and project ID verified.");
          NODE
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15
      - name: Deploy Functions to original Firebase project
        run: firebase deploy --only functions --project jovenes-de-fuego --non-interactive
