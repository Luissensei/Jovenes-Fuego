name: Build verification

on:
  push:
    branches:
      - "redesign/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and Vite production build
        run: npm run build
      - name: Lint source code
        run: npm run lint
      - name: Resumen de auditoría de dependencias
        run: |
          npm audit --json > /tmp/jf-npm-audit.json || true
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/jf-npm-audit.json', 'utf8')); const v = r.metadata?.vulnerabilities ?? {}; console.log('Auditoría npm:', JSON.stringify(v)); for (const [name, item] of Object.entries(r.vulnerabilities ?? {})) console.log(name + ' | ' + item.severity + ' | fixAvailable: ' + JSON.stringify(item.fixAvailable));"
