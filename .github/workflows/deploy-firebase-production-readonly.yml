name: Deploy Firebase production read-only bridge

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirmo que este despliegue contiene únicamente funciones de lectura."
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  deploy-read-only:
    if: inputs.confirm_read_only == true && github.ref == 'refs/heads/connect/production-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: firebase-production-readonly

    steps:
      - name: Checkout rama revisada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Instalar dependencias aisladas
        run: npm install --prefix functions-readonly

      - name: Compilar únicamente las funciones de lectura
        run: npm run build --prefix functions-readonly

      - name: Instalar Firebase CLI fijado
        run: npm install --global firebase-tools@15.34.2

      - name: Preparar credencial protegida
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO_PRODUCTION_READONLY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-production-readonly.json
        run: |
          node -e "const fs = require('fs'); const value = process.env.FIREBASE_SERVICE_ACCOUNT_JSON; if (!value) throw new Error('Falta el secreto de la cuenta de servicio de producción de solo lectura.'); JSON.parse(value); fs.writeFileSync(process.env.GOOGLE_APPLICATION_CREDENTIALS, value, { mode: 0o600 });"

      - name: Desplegar exclusivamente el codebase readonly
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-production-readonly.json
        run: firebase deploy --only functions:readonly --project jovenes-de-fuego --non-interactive

      - name: Eliminar credencial temporal
        if: always()
        run: rm -f "${{ runner.temp }}/firebase-production-readonly.json"
