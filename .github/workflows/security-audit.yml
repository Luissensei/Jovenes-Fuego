name: Security dependency audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "30 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Audit application dependencies
        id: app-audit
        shell: bash
        run: |
          set +e
          npm audit --json > application-audit.json
          echo "app_full=$?" >> "$GITHUB_OUTPUT"
          npm audit --omit=dev --json > application-production-audit.json
          echo "app_production=$?" >> "$GITHUB_OUTPUT"

      - name: Install Cloud Functions dependencies
        run: npm ci
        working-directory: functions

      - name: Audit Cloud Functions dependencies
        id: functions-audit
        shell: bash
        working-directory: functions
        run: |
          set +e
          npm audit --json > ../functions-audit.json
          echo "functions_full=$?" >> "$GITHUB_OUTPUT"
          npm audit --omit=dev --json > ../functions-production-audit.json
          echo "functions_production=$?" >> "$GITHUB_OUTPUT"

      - name: Summarize vulnerabilities
        if: always()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of ['application-audit.json', 'application-production-audit.json', 'functions-audit.json', 'functions-production-audit.json']) {
            if (!fs.existsSync(file)) {
              console.log(file + ': audit report unavailable');
              continue;
            }
            let report;
            try { report = JSON.parse(fs.readFileSync(file, 'utf8')); }
            catch { console.log(file + ': npm did not return valid JSON'); continue; }
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log('\n' + file);
            console.log('Counts:', JSON.stringify(counts));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(v => typeof v === 'string' ? v : v.title).filter(Boolean);
              console.log('- ' + name + ' [' + item.severity + '] range=' + item.range +
                ' fix=' + JSON.stringify(item.fixAvailable) + ' advisories=' + via.join('; '));
            }
          }
          NODE

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-security-audit
          path: |
            application-audit.json
            application-production-audit.json
            functions-audit.json
            functions-production-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when vulnerabilities are reported
        if: always()
        env:
          APP_FULL: ${{ steps.app-audit.outputs.app_full }}
          APP_PRODUCTION: ${{ steps.app-audit.outputs.app_production }}
          FUNCTIONS_FULL: ${{ steps.functions-audit.outputs.functions_full }}
          FUNCTIONS_PRODUCTION: ${{ steps.functions-audit.outputs.functions_production }}
        run: |
          if [ "${APP_FULL:-1}" != "0" ] || [ "${APP_PRODUCTION:-1}" != "0" ] || [ "${FUNCTIONS_FULL:-1}" != "0" ] || [ "${FUNCTIONS_PRODUCTION:-1}" != "0" ]; then
            echo "::error::npm audit found vulnerabilities or could not complete. Review the uploaded audit reports."
            exit 1
          fi
