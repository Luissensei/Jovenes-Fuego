name: Actualizar Firebase de forma segura

on:
  push:
    branches:
      - "redesign/gaming-community-v1"

permissions:
  contents: write

jobs:
  update-firebase:
    if: github.ref == 'refs/heads/redesign/gaming-community-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de rediseño
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Definir entorno Node compatible
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.engines={...(p.engines ?? {}), node: '>=24.12.0'}; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n');"
          echo "24.12.0" > .nvmrc

      - name: Actualizar SDK de Firebase
        run: npm install firebase@13.1.0 --save

      - name: Compilar TypeScript y Vite
        run: npm run build

      - name: Revisar ESLint
        run: npm run lint

      - name: Diagnosticar auditoría de dependencias runtime
        run: |
          npm audit --omit=dev --json > /tmp/jf-firebase-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/jf-firebase-audit.json', 'utf8'));
          console.log('Resumen runtime:', report.metadata?.vulnerabilities ?? {});
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(name + ' | severity=' + item.severity + ' | range=' + item.range);
            for (const entry of item.via ?? []) {
              if (typeof entry !== 'string') console.log('  advisory=' + entry.title + ' | range=' + entry.range + ' | url=' + entry.url);
            }
            console.log('  paths=' + (item.nodes ?? []).join(', '));
          }
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [name, info] of Object.entries(lock.packages ?? {})) {
            if (name.endsWith('node_modules/@grpc/grpc-js')) console.log('GRPC_LOCK ' + name + ' = ' + info.version);
          }
          if ((report.metadata?.vulnerabilities?.high ?? 0) > 0 || (report.metadata?.vulnerabilities?.critical ?? 0) > 0) process.exit(1);
          NODE

      - name: Guardar actualización solo en esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "No hay cambios de dependencias para guardar."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "Actualizar Firebase SDK y dependencias de seguridad"
          git push origin HEAD
