version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    ignore:
      # Mantener Vite 6 + plugin-react 4 hasta validar una migración conjunta a Vite 8.
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
    groups:
      frontend-patch-and-minor:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - security

  - package-ecosystem: npm
    directory: "/functions"
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    groups:
      functions-patch-and-minor:
        update-types:
          - patch
          - minor
    labels:
      - dependencies
      - security
