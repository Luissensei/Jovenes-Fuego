name: Actualizar Firebase de forma segura

on:
  push:
    branches:
      - "redesign/gaming-community-v1"

permissions:
  contents: write

jobs:
  update-firebase:
    if: github.ref == 'refs/heads/redesign/gaming-community-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de rediseño
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm

      - name: Definir entorno Node compatible
        run: |
          node -e "const fs=require('fs'); const p=require('./package.json'); p.engines={...(p.engines ?? {}), node: '24.x'}; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\\n');"
          echo "24.12.0" > .nvmrc

      - name: Actualizar SDK de Firebase
        run: npm install firebase@13.1.0 react-router-dom@7.18.0 --save

      - name: Compilar TypeScript y Vite
        run: npm run build

      - name: Revisar ESLint
        run: npm run lint

      - name: Auditar dependencias runtime y clasificar transporte Node
        run: |
          npm audit --omit=dev --json > /tmp/jf-firebase-audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/jf-firebase-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Resumen runtime:', counts);
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log(name + ' | severity=' + item.severity + ' | range=' + item.range);
            for (const entry of item.via ?? []) {
              console.log('  via=' + (typeof entry === 'string' ? entry : entry.title + ' | ' + entry.url));
            }
          }
          const seen = new Set();
          function isGrpcOnlyChain(name) {
            if (name === '@grpc/grpc-js') return true;
            if (seen.has(name)) return false;
            seen.add(name);
            const item = report.vulnerabilities?.[name];
            return Boolean(item?.via?.length) && item.via.every((entry) => {
              const dependency = typeof entry === 'string' ? entry : entry.name;
              return dependency ? isGrpcOnlyChain(dependency) : false;
            });
          }
          const high = Object.entries(report.vulnerabilities ?? {}).filter(([, item]) =>
            item.severity === 'high' || item.severity === 'critical'
          );
          const unexpected = high.filter(([name]) => !isGrpcOnlyChain(name));
          if (unexpected.length) {
            console.error('Vulnerabilidades altas no atribuibles solo a @grpc/grpc-js:', unexpected.map(([name]) => name));
            process.exit(1);
          }
          if ((counts.moderate ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            console.error('Quedan vulnerabilidades moderadas o críticas en dependencias runtime.');
            process.exit(1);
          }
          if (high.length) {
            console.log('AVISO TRACKED: las alertas altas restantes dependen solo del transporte gRPC Node fijado por @firebase/firestore.');
            console.log('Firebase Web usa WebChannel en navegador; no se fuerza un override fuera del rango upstream.');
          }
          NODE


      - name: Guardar actualización solo en esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "No hay cambios de dependencias para guardar."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "Actualizar Firebase SDK y dependencias de seguridad"
          git push origin HEAD
