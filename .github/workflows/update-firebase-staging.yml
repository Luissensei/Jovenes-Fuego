name: Actualizar Firebase de forma segura

on:
  push:
    branches:
      - "redesign/gaming-community-v1"

permissions:
  contents: write

jobs:
  update-firebase:
    if: github.ref == 'refs/heads/redesign/gaming-community-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama de rediseño
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Actualizar SDK de Firebase
        run: npm install firebase@13.1.0 --save

      - name: Compilar TypeScript y Vite
        run: npm run build

      - name: Revisar ESLint
        run: npm run lint

      - name: Bloquear vulnerabilidades altas en producción
        run: |
          npm audit --omit=dev --json > /tmp/jf-firebase-audit.json || true
          node -e "const r = JSON.parse(require('fs').readFileSync('/tmp/jf-firebase-audit.json', 'utf8')); const v = r.metadata?.vulnerabilities ?? {}; console.log('Auditoría runtime:', JSON.stringify(v)); if ((v.high ?? 0) > 0 || (v.critical ?? 0) > 0) process.exit(1);"

      - name: Guardar actualización solo en esta rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- package.json package-lock.json; then
            echo "No hay cambios de dependencias para guardar."
            exit 0
          fi
          git add package.json package-lock.json
          git commit -m "Actualizar Firebase SDK y dependencias de seguridad"
          git push origin HEAD
