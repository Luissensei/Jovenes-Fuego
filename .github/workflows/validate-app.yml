name: Validate application

on:
  push:
    branches:
      - main
      - fix/functions-eslint-deploy
      - fix/security-audit-node22
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript and Vite build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Lint application
        run: npm run lint

      - name: Run project smoke checks
        run: npm run check:smoke

      - name: Lint Cloud Functions
        run: npm --prefix functions run lint
