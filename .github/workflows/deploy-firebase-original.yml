name: Deploy Firebase Original Functions

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-firebase-original.yml'
      - 'functions/**'
      - 'firebase.json'

permissions:
  contents: read

jobs:
  deploy-original-functions:
    name: Deploy Cloud Functions to original Firebase project
    runs-on: ubuntu-24.04
    environment: firebase-production
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v7
      - name: Configure Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install Firebase Functions dependencies
        run: npm ci
        working-directory: functions
      - name: Lint Firebase Functions
        run: npx eslint -c .eslintrc.js "src/**/*.ts"
        working-directory: functions
        env:
          ESLINT_USE_FLAT_CONFIG: 'false'
      - name: Build Firebase Functions
        run: npm run build
        working-directory: functions
      - name: Verify Firebase deployment credential
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error title=Missing GitHub environment secret::Add FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO to Settings > Environments > firebase-production > Environment secrets."
            exit 1
          fi
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JOVENES_DE_FUEGO }}
      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15
      - name: Deploy Functions to original Firebase project
        run: firebase deploy --only functions --project jovenes-de-fuego --non-interactive
